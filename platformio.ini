[platformio]
default_envs = c3

[env]
platform = espressif32@7.1.3   ; pinned: 8.x grew the C3 build past its 1.3 MB OTA slot
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
